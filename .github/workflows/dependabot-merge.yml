# Merge approved Dependabot PRs.
#
# Arms GitHub's native auto-merge on approved Dependabot PRs and keeps their
# branches level with main so the strict status-check policy can be satisfied.
#
# WHY THIS SHAPE
#
# The previous design issued a bare `gh pr merge` inside a 15-minute
# `gh pr checks --watch`. The main ruleset sets strict_required_status_checks_policy,
# so a PR must be level with main to merge at all. Dependabot opens its updates
# in a batch; the moment one merges, every sibling is BEHIND and the bare merge
# dies with "the head branch is not up to date with the base branch". Nothing
# retried, because the only trigger was a CI run for that branch and a branch
# going stale pushes no commit. On 2026-07-27 four approved, fully-green PRs sat
# wedged that way until a human intervened.
#
# Two changes fix that:
#
#   1. `--auto` hands the merge to GitHub, so the workflow no longer has to sit
#      in a watch and no longer fails just for arriving before the checks do.
#      Auto-merge on its own is NOT sufficient: it waits for requirements but
#      will not refresh a stale branch, so a BEHIND PR stays BEHIND forever.
#   2. A `push: main` trigger. Main moving is the event that actually
#      invalidates these PRs, so it is the correct thing to retry on. Every
#      merge into main re-sweeps the remaining open Dependabot PRs, updates the
#      stale ones, and re-arms. A batch therefore drains one at a time.
#
# CONFIRMED AND FIXED (2026-08-03). The risk recorded here on 2026-07-27 came
# true. The EXACT MECHANISM is not what that note guessed, and the difference
# matters to anyone debugging this later -- so read this rather than grepping
# for the old wording.
#
# WHAT THE OLD NOTE SAID: pushes made with GITHUB_TOKEN start no workflow runs,
# so the checks never run.
#
# WHAT ACTUALLY HAPPENS: the runs ARE created. They are HELD, in
# `status=completed, conclusion=action_required`, waiting for a human to press
# "Approve and run" in the Actions UI. Nobody approves them, so they never
# execute, so the head accumulates zero check runs. Same observable end state,
# different cause. Measured on the wedged batch: EIGHT held runs per affected PR
# (CI, Bruno API Tests, Security, CodeQL, Signed Commits, Pre-Push Gate,
# Auto-approve Dependabot PRs, Re-request Copilot review) across six PRs -- ~48
# runs queued for manual approval.
#
# THE DISCRIMINATOR IS THE HEAD COMMIT'S AUTHOR, established by a same-branch,
# same-workflow comparison (so branch, workflow and content are all controlled
# for) -- runs of THIS repo's auto-approve workflow on the SAME Dependabot
# branch:
#
#   head SHA authored by            run actor / triggering_actor   conclusion
#   dependabot[bot]                 dependabot[bot]                success
#   github-actions[bot] (our push)  github-actions[bot]            action_required
#   github-actions[bot] (our push)  sydlexius (manual approval)    success
#
# When update-branch below runs with GITHUB_TOKEN it re-authors the head as
# `github-actions[bot]`, every workflow on that head is attributed to that bot,
# and bot-attributed runs are gated behind manual approval. The third row is the
# maintainer clearing them by hand, which is the workaround this change exists
# to eliminate.
#
# THE LOOP IS SELF-PERPETUATING, which is the part that makes it more than an
# annoyance. Approving the runs by hand does NOT settle the batch. Timeline,
# measured: PR #2915 (the only one still carrying a Dependabot-authored head,
# hence the only one with real checks) merged at 19:09:22Z. That merge fired the
# `push: main` sweep, which found the remaining six BEHIND and re-ran
# update-branch on all of them -- new head SHAs at 19:21:58Z through 19:22:24Z,
# each freshly bot-authored, each with a new batch of held runs. So every merge
# re-wedges every survivor, and hand-approving is work that the next merge
# throws away. A batch cannot drain itself.
#
# NOT FIXABLE BY A REPOSITORY SETTING -- see the note below on
# fork-pr-contributor-approval before reaching for one.
#
# THE FIX: the update-branch call is made with a PAT (DEPENDABOT_UPDATE_TOKEN)
# rather than GITHUB_TOKEN. The head is then authored by a real repository
# contributor rather than by `github-actions[bot]`, so the runs on it are
# attributed to that user and start immediately instead of being held -- exactly
# the third row of the table above, minus the human. When the secret is absent
# the workflow DECLINES to update and fails the job loudly; see the asymmetry
# argument at the step below for why declining beats falling back.
#
# WHY NOT JUST CHANGE A REPOSITORY SETTING. The obvious suspect is
# `actions/permissions/fork-pr-contributor-approval`, which is set to
# `first_time_contributors_new_to_github`. Two reasons that is not the lever:
#
#   1. It is ALREADY at its loosest value. The enum is
#      first_time_contributors_new_to_github / first_time_contributors /
#      all_external_contributors -- three thresholds, each stricter than the
#      last, and NO value meaning "never require approval". There is nothing to
#      loosen; the only available moves make the gating stricter.
#   2. It is a FORK-PR policy, and these are in-repo branches, not forks. The
#      held runs are real and measured, but attributing them to this setting is
#      pattern-matching on its name. The gating that is actually documented for
#      this case is on bot-authored pull requests / bot-attributed runs.
#
# So no settings change fixes this, and in particular DO NOT relax
# fork-pr-contributor-approval hoping to clear it -- that would weaken a
# security control, in the wrong direction, for no effect on this bug.
#
# OPTIONS CONSIDERED AND REJECTED
#
#   (a) Post `@dependabot rebase` with GITHUB_TOKEN. Rejected on two independent
#       grounds. First, Dependabot refuses comment commands from a GitHub App
#       identity even when that app has write access -- it replies "Sorry, only
#       users with push access can use that command"
#       (dependabot/dependabot-core#9147), and `github-actions[bot]` is exactly
#       such an identity. The earlier note above said a bot-authored rebase
#       comment is "reportedly ignored"; the real behaviour is a refusal, which
#       is at least loud, but it is still a refusal. Second, even with a token
#       Dependabot accepts, the rebase command has a long tail of reports where
#       the job runs green and pushes nothing (dependabot-core #6886, #7018,
#       #10118, #10310, #11803). It adds a dependency on a flaky remote command
#       surface to solve a problem a token swap solves outright.
#   (b) `workflow_dispatch` / `repository_dispatch` to re-run the checks. The
#       required set is 17 contexts spread over ci.yml, gate.yml, codeql.yml,
#       security.yml and bruno-ci.yml, and most of those jobs read
#       `github.event.pull_request`, which does not exist on a dispatch event.
#       Making them dispatch-capable means rewriting five workflows to carry a
#       second event shape, and every future required check inherits that
#       obligation or silently re-wedges the pipeline. Enormous blast radius,
#       and it treats the symptom (no checks) rather than the cause (a
#       bot-authored head).
#   (c) Close and reopen the PR. Drops the auto-merge arming and any review
#       state, Dependabot may read the close as "do not recreate this update",
#       and it leaves the head bot-authored -- so any runs it did start would be
#       held for approval exactly as before. Crude and does not address the
#       cause.
#   (d) Re-run the existing CI run via the API. Re-running reports its results
#       against the run's ORIGINAL head SHA, which is not the SHA the branch
#       protection is evaluating. It produces green checks on a commit nobody is
#       waiting on.
#   (e) Approve the held runs by hand, or automate approving them. This is what
#       was happening before, and it does not converge: as the timeline above
#       shows, the next merge to main re-runs update-branch on every survivor
#       and produces a fresh bot-authored head with a fresh batch of held runs.
#       Automating the approval would also mean auto-approving bot-attributed
#       workflow runs as a policy, which is the control that exists to stop
#       generated code from running against repository secrets. Wrong trade.
#
# A PAT-authored update-branch (the chosen fix) is the smallest change that
# actually restores the invariant: it keeps the proven mechanism and swaps only
# the identity that performs the push.

name: Merge approved Dependabot PRs

# `workflow_run` is flagged by zizmor's dangerous-triggers audit (alert 193)
# because the handler runs in the BASE repository's context -- with base
# secrets and write scopes -- while being reachable from a fork's pull
# request. That context inversion is the whole risk.
#
# The trigger is kept because dropping it costs sweep latency: the `push: main`
# path below covers the same ground, but a freshly-green PR would then wait for
# the next merge to main instead of being armed as soon as its CI finishes. The
# audit fires on the trigger's presence alone, so no `if:` guard clears it
# (verified against zizmor 1.27.0 and 1.28.0: still `1 high` with every guard
# below in place). Suppressing it is therefore a statement about the residual
# risk, not a dismissal of the finding.
#
# What actually closes the risk is the job gate below, which requires
# `head_repository.full_name == github.repository`. A fork PR cannot satisfy
# that, so the privileged steps never run for one. Note the branch-name check
# alone was NOT sufficient: `head_branch` is attacker-controlled string data
# (anyone can push a fork branch named `dependabot/evil`), so it is a
# convenience filter, not an identity check.
#
# This workflow also checks out no repository code and runs no code from the
# PR under consideration -- it only calls the `gh` CLI -- so there is no path
# from fork-authored content to execution here.
#
# !! TRIPWIRE -- READ BEFORE ADDING A TRIGGER TO THE `on:` BLOCK BELOW !!
# The ignore comment suppresses dangerous-triggers for the ENTIRE `on:` mapping,
# not just `workflow_run`. zizmor's finding spans the whole block, so there is no
# in-file way to scope it more narrowly (moving the comment onto `workflow_run:`
# does not help -- measured). Consequence: adding `pull_request_target` here
# would be silently swallowed -- no finding, no new code-scanning alert, and the
# post-merge scan would report clean. The usual safety net does NOT fire for a
# trigger added to this block. scripts/check-zizmor-suppressions.sh is what
# actually enforces that: it pins the dangerous triggers this block may contain,
# so adding one fails the gate until you justify it here, against the same
# fork-context reasoning above, and update that manifest.
on: # zizmor: ignore[dangerous-triggers] mitigated by the head_repository gate, see above
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  push:
    branches:
      - main

permissions: {}

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read
    # On workflow_run, only act on a successful CI run for a Dependabot branch.
    # On push to main, always sweep.
    #
    # The head_repository clause is the fork boundary -- see the extended note
    # on the `on:` block above. It is the only condition here that an attacker
    # cannot satisfy: `head_branch` is fork-controlled string data (a fork
    # branch can be named `dependabot/anything`), so it filters, it does not
    # authenticate. The `push` path needs no such guard, as only a write to
    # this repository's main can produce it.
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       startsWith(github.event.workflow_run.head_branch, 'dependabot/'))
    # Serialize the sweep against itself so two merges landing together cannot
    # both try to update the same PR. Keyed per-branch for the workflow_run
    # path, and on a single shared key for the main sweep.
    concurrency:
      group: dependabot-merge-${{ github.event_name == 'push' && 'main-sweep' || github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      - name: Collect candidate pull requests
        id: candidates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            # Sweep every open Dependabot PR. head_ref_name is filtered
            # client-side because `gh pr list --head` takes an exact branch.
            NUMBERS=$(gh pr list --repo "$REPO" --state open \
              --json number,headRefName,author \
              --jq '[ .[]
                      | select(.headRefName | startswith("dependabot/"))
                      | select(.author.login == "dependabot[bot]" or .author.login == "app/dependabot")
                      | .number ] | join(" ")')
          else
            NUMBERS=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open \
              --json number,author \
              --jq '[ .[]
                      | select(.author.login == "dependabot[bot]" or .author.login == "app/dependabot")
                      | .number ] | join(" ")')
          fi
          if [ -z "$NUMBERS" ]; then
            echo "No open Dependabot pull requests to process."
          else
            echo "Candidates: $NUMBERS"
          fi
          echo "numbers=$NUMBERS" >> "$GITHUB_OUTPUT"

      - name: Update stale branches and arm auto-merge
        if: steps.candidates.outputs.numbers != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The branch-update push MUST NOT be made with GITHUB_TOKEN. The
          # event sequence matters, because "no checks appear" has two very
          # different causes and only one of them is this: the push itself
          # starts no `push`-triggered workflow runs, but updating the pull
          # request DOES emit a `pull_request` `synchronize` event, and the
          # runs it creates are held in `action_required` awaiting manual
          # approval because the head is now authored by github-actions[bot].
          # So the runs exist and never execute. The required checks never
          # report on the new head and the PR is wedged permanently (see the
          # CONFIRMED AND FIXED note at the top of this file).
          #
          # SETUP -- this is a repository ACTIONS secret, not a Dependabot
          # secret. This workflow is triggered by `workflow_run` and `push`, so
          # it runs in the base repository's context and reads the ordinary
          # Actions secret store; the Dependabot store is only consulted for
          # workflows triggered by a Dependabot-authored `pull_request`.
          #
          #   1. Create a fine-grained PAT scoped to THIS REPOSITORY ONLY, with
          #      exactly two repository permissions:
          #        - Contents: Read and write   (to push the merge commit)
          #        - Pull requests: Read and write (update-branch is a PR API)
          #      Nothing else. Do not use a classic `repo` token: its scope is
          #      every repository the owner can reach.
          #   2. gh secret set DEPENDABOT_UPDATE_TOKEN --repo <owner>/<repo>
          #   3. Set a calendar reminder for its expiry. When it lapses the
          #      fallback below fires and the job fails loudly, which is the
          #      intended behaviour, not a regression.
          #
          # An empty value here is the unconfigured state and is handled
          # explicitly below.
          UPDATE_TOKEN: ${{ secrets.DEPENDABOT_UPDATE_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          NUMBERS: ${{ steps.candidates.outputs.numbers }}
        # The sweep is per-PR sequential, so the ceiling scales with the batch.
        # Dependabot's limits allow ~26 open PRs across all ecosystems here.
        timeout-minutes: 30
        run: |
          set -euo pipefail

          # An approval from the auto-approve workflow may still be in flight
          # when CI finishes, so give it a short grace period. Only worth doing
          # for a single freshly-built PR; the main sweep has no race to lose
          # and unapproved PRs are simply picked up on a later sweep.
          if [ "$EVENT" = "push" ]; then
            ATTEMPTS=1
          else
            ATTEMPTS=6
          fi

          # Latest review per user, so a stale APPROVED that was later dismissed
          # or changed does not count.
          is_approved() {
            gh api "repos/$REPO/pulls/$1/reviews" --paginate \
              | jq -s 'add // []
                       | sort_by(.user.login, .submitted_at)
                       | group_by(.user.login)
                       | map(last)
                       | map(select(.state == "APPROVED"))
                       | length'
          }

          FAILED=0
          for PR_NUMBER in $NUMBERS; do
            echo "::group::PR #$PR_NUMBER"

            APPROVED=0
            for i in $(seq 1 "$ATTEMPTS"); do
              APPROVED=$(is_approved "$PR_NUMBER") || APPROVED=0
              if [ "$APPROVED" -gt 0 ]; then break; fi
              if [ "$i" -lt "$ATTEMPTS" ]; then
                echo "Attempt $i/$ATTEMPTS: no approval yet, waiting 30s..."
                sleep 30
              fi
            done
            if [ "$APPROVED" -eq 0 ]; then
              echo "PR #$PR_NUMBER is not approved (a major version bump needs a human review); skipping."
              echo "::endgroup::"
              continue
            fi

            # mergeStateStatus is computed asynchronously and reads UNKNOWN
            # until GitHub finishes. Acting on UNKNOWN would misfile a stale PR
            # as current, so poll for a settled value.
            STATE=UNKNOWN
            for i in $(seq 1 6); do
              STATE=$(gh pr view "$PR_NUMBER" --repo "$REPO" \
                --json mergeStateStatus --jq '.mergeStateStatus')
              if [ "$STATE" != "UNKNOWN" ]; then break; fi
              echo "Attempt $i/6: mergeability still being computed, waiting 5s..."
              sleep 5
            done
            if [ "$STATE" = "UNKNOWN" ]; then
              # Never guess. Treating UNKNOWN as current would arm auto-merge on
              # a branch that may be stale and never get updated; the next sweep
              # re-evaluates with a settled answer.
              echo "::warning::Mergeability for PR #$PR_NUMBER did not settle; deferring to the next sweep."
              echo "::endgroup::"
              continue
            fi
            echo "PR #$PR_NUMBER merge state: $STATE"

            if [ "$STATE" = "DIRTY" ]; then
              echo "::warning::PR #$PR_NUMBER has merge conflicts; Dependabot must recreate it. Leaving for manual review."
              echo "::endgroup::"
              continue
            fi

            # Arm auto-merge before updating the branch. Auto-merge can be armed
            # while the PR is BEHIND, and doing it first means the merge fires as
            # soon as the update lands rather than waiting for another sweep.
            if ! gh pr merge "$PR_NUMBER" --repo "$REPO" --squash --delete-branch --auto; then
              echo "::error::Could not enable auto-merge on PR #$PR_NUMBER. If this reports that auto-merge is disabled, enable Settings > General > Allow auto-merge."
              FAILED=1
              echo "::endgroup::"
              continue
            fi
            echo "Auto-merge armed on PR #$PR_NUMBER."

            if [ "$STATE" = "BEHIND" ]; then
              # The strict status-check policy blocks a stale branch and
              # auto-merge will not refresh one, so merge main in explicitly.
              #
              # WHICH TOKEN MAKES THIS CALL IS THE ENTIRE FIX. The token decides
              # who AUTHORS the resulting merge commit, and that authorship
              # decides whether the workflow runs on the new head start or are
              # held for manual approval. Same API call, opposite outcome.
              if [ -n "${UPDATE_TOKEN:-}" ]; then
                if GH_TOKEN="$UPDATE_TOKEN" \
                     gh api -X PUT "repos/$REPO/pulls/$PR_NUMBER/update-branch" >/dev/null; then
                  echo "Requested branch update for PR #$PR_NUMBER (PAT-authored head; runs start without manual approval)."
                else
                  echo "::warning::Could not update the branch for PR #$PR_NUMBER; a later sweep will retry."
                fi
              else
                # UNCONFIGURED PATH -- DO NOT UPDATE. Falling back to
                # GITHUB_TOKEN here looks like the helpful choice and is the
                # worse one, because the two outcomes are not symmetric:
                #
                #   not updating  -> the PR stays BEHIND and untouched. Nothing
                #                    is lost, no runs are queued for anyone to
                #                    approve, and the moment the secret is
                #                    configured the next sweep updates it
                #                    correctly. Fully recoverable.
                #   updating with -> a fresh bot-authored head, whose ~8
                #   GITHUB_TOKEN     workflow runs are all held for manual
                #                    approval. The maintainer must either clear
                #                    them by hand or leave the PR stuck, and the
                #                    next merge to main repeats the whole thing.
                #                    This is what produced ~48 held runs across
                #                    six PRs on 2026-08-03.
                #
                # So the update is gated on a POSITIVE check for the token, and
                # the unconfigured case declines and fails the job loudly rather
                # than generating work for a human.
                echo "::error::DEPENDABOT_UPDATE_TOKEN is not configured, so PR #$PR_NUMBER was NOT updated and stays BEHIND. Updating it with GITHUB_TOKEN would re-author its head as github-actions[bot], which holds every workflow run on that head for manual approval -- so this workflow declines to. Configure the secret (see the step's env comment); the next sweep will then update and merge it normally."
                FAILED=1
              fi
            fi

            echo "::endgroup::"
          done

          exit "$FAILED"
