# Automatically assign a milestone to PRs based on the issues they reference.
# Parses "Fixes #N", "Closes #N", and "Resolves #N" from the PR body,
# looks up each issue's milestone, and assigns the first one found.
# Warns via comment if referenced issues have conflicting milestones.

name: PR Milestone

# `pull_request_target` is flagged by zizmor's dangerous-triggers audit: it runs
# in the BASE repository's context, with base secrets and write scopes, while
# being triggerable by a fork PR. That context inversion is the whole risk.
#
# It is required here for two reasons. The job needs `pull-requests: write` on
# the base repo to set a milestone, and GitHub force-downgrades a fork PR's
# token to read-only under `pull_request` no matter what `permissions:` asks
# for. And under `pull_request` a fork PR would supply the workflow definition
# itself, so the automation would be redefinable by the PR it acts on. The audit
# fires on the trigger's presence alone, so no `if:` guard clears it.
#
# What closes the risk is that this workflow never gives fork-authored content a
# path to execution. It checks out nothing, so no PR-head code is ever present
# to run, and there is no `${{ }}` interpolation anywhere in the file. The PR
# body is regex-matched for issue references and immediately `parseInt`-ed to an
# integer, so no PR-authored text reaches a shell command, a script, or an API
# path. The posted conflict-warning body interpolates only milestone titles
# (settable only with write access to this repo) and those already-integer issue
# numbers.
#
# The conflict-warning upsert also reads existing PR comments, which ARE
# fork-authored. It matches on the sentinel AND on the comment's author being
# our own bot, so a planted sentinel cannot redirect the privileged
# updateComment onto an attacker's comment (see the note at that call).
#
# Job permissions are minimized (`issues: read`, `pull-requests: write`) against
# a top-level `permissions: {}`.
#
# Recorded here rather than as a code-scanning dismissal. A dismissal is keyed
# to the finding's fingerprint, so editing the file resurrects the alert: that
# happened on dependabot-merge.yml, where alert 140 was dismissed in July and
# returned as a new alert 193 after an unrelated edit (#2838), which #2842 then
# re-recorded in-file. An inline ignore travels with the file and cannot drift
# from the code it describes.
#
# !! TRIPWIRE -- READ BEFORE ADDING A TRIGGER TO THE `on:` BLOCK BELOW !!
# The ignore below suppresses dangerous-triggers for the ENTIRE `on:` mapping,
# not just `pull_request_target`. zizmor's finding spans the whole block and
# there is no way to scope it more narrowly (measured -- moving the comment onto
# the trigger key does not help). Consequence: another dangerous trigger added
# here would be silently swallowed -- no finding, no code-scanning alert, and a
# clean post-merge scan. The usual safety net does NOT fire for a trigger added
# to this block. scripts/check-zizmor-suppressions.sh is what actually enforces
# that: it pins the dangerous triggers this block may contain, so adding one
# fails the gate until you justify it here and update that manifest.
#
# Nothing enforces the SINK claims above, though -- so read them before adding a
# consumer of `context.payload` or a new API call to the script below.
on: # zizmor: ignore[dangerous-triggers] no checkout, PR body parsed as data only, see above
  pull_request_target:
    types: [opened, edited]
    branches: [main]

permissions: {}

jobs:
  assign-milestone:
    runs-on: ubuntu-latest
    permissions:
      issues: read
      pull-requests: write
    # Skip bot PRs (Dependabot, etc.) -- they never reference milestone issues
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - name: Assign milestone from linked issues
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';

            // Parse issue references: Fixes #N, Closes #N, Resolves #N
            // `Part of #N` is the repo's HOUSE CONVENTION for an epic-child PR: it
            // links the PR to the epic WITHOUT auto-closing it (GitHub only
            // auto-closes on fixes/closes/resolves). Omitting it from this pattern
            // meant the rule that protects an epic from being auto-closed was the
            // same rule that made this automation skip the PR entirely -- silently,
            // with the job reporting success (#2412).
            const pattern = /\b(?:fix(?:e[sd])?|close[sd]?|resolve[sd]?|part\s+of)\s+#(\d+)/gi;
            const issueNumbers = [];
            let match;
            while ((match = pattern.exec(body)) !== null) {
              const num = parseInt(match[1], 10);
              if (!issueNumbers.includes(num)) {
                issueNumbers.push(num);
              }
            }

            if (issueNumbers.length === 0) {
              core.info('No issue references found in PR body, skipping');
              return;
            }

            core.info(`Found issue references: ${issueNumbers.map(n => '#' + n).join(', ')}`);

            // Look up milestones for each referenced issue
            const milestones = new Map();
            for (const num of issueNumbers) {
              try {
                const issue = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: num,
                });
                if (issue.data.pull_request) {
                  core.info(`#${num} is a pull request, skipping`);
                  continue;
                }
                if (issue.data.milestone) {
                  const ms = issue.data.milestone;
                  if (!milestones.has(ms.number)) {
                    milestones.set(ms.number, { title: ms.title, number: ms.number, issues: [] });
                  }
                  milestones.get(ms.number).issues.push(num);
                }
              } catch (err) {
                core.warning(`Could not fetch issue #${num}: ${err.message}`);
              }
            }

            if (milestones.size === 0) {
              core.info('No referenced issues have milestones, skipping');
              return;
            }

            const entries = Array.from(milestones.values());
            const target = entries[0];

            // Warn if issues reference conflicting milestones (upsert to avoid spam)
            if (milestones.size > 1) {
              const sentinel = '<!-- pr-milestone-conflict -->';
              const list = entries
                .map(m => `- **${m.title}** (from ${m.issues.map(n => '#' + n).join(', ')})`)
                .join('\n');
              const warningBody = [
                sentinel,
                'This PR references issues from multiple milestones:',
                '',
                list,
                '',
                `Auto-assigned the milestone from the first match: **${target.title}**.`,
                'Update manually if this is incorrect.',
              ].join('\n');

              // Find our existing warning comment to update instead of posting a
              // second one.
              //
              // github.paginate, not a bare listComments: the unpaginated call
              // returns only the first 30 comments, so on a longer thread the
              // search missed an existing warning and createComment posted a
              // duplicate -- the exact spam this upsert exists to prevent. Every
              // other list call in these workflows paginates; this one did not.
              //
              // The author filter is a security boundary, not tidiness. The
              // sentinel is just a string in a comment body, so matching on it
              // alone let a fork PR author plant it in a comment of their own and
              // have this privileged updateComment target a comment they chose.
              // A comment's author cannot be forged, so requiring OUR bot to be
              // the author closes that. Checked with `type === 'Bot'` as well,
              // because a human account could in principle be named to collide.
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                per_page: 100,
              });
              const existing = comments.find(c =>
                c.body &&
                c.body.includes(sentinel) &&
                c.user &&
                c.user.type === 'Bot' &&
                c.user.login === 'github-actions[bot]'
              );

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: warningBody,
                });
                core.info('Updated existing conflict warning comment');
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body: warningBody,
                });
              }

              core.warning(`Conflicting milestones detected, assigned "${target.title}"`);
            }

            // Only auto-assign when the PR has no milestone; respect manual choices
            if (pr.milestone) {
              core.info(`PR already has milestone "${pr.milestone.title}", not overwriting`);
              return;
            }

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              milestone: target.number,
            });

            core.info(`Assigned milestone "${target.title}" to PR #${pr.number}`);
