name: Nightly

on:
  schedule:
    - cron: '0 0 * * *' # midnight UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nightly:
    if: github.ref == 'refs/heads/main'
    name: Nightly Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main

      # Docker Hub rate limits anonymous pulls (and so does ECR Public), so
      # log in before anything pulls from it: the base images, plus
      # moby/buildkit (setup-buildx) and tonistiivi/binfmt (setup-qemu) where
      # those run (#3487). Secrets never reach fork pull requests, and the
      # token may not be set yet: then the job still runs, pulls anonymously,
      # and says so with a warning. `secrets` is not allowed in a step `if:`,
      # hence the separate check step.
      - name: Check Docker Hub credentials
        id: dockerhub
        env:
          HAS_DOCKERHUB_CREDS: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          if [ "$HAS_DOCKERHUB_CREDS" = "true" ]; then
            echo "login=true" >> "$GITHUB_OUTPUT"
          else
            echo "login=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Anonymous Docker Hub pulls::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are not available to this run (a fork pull request, or the secrets are not set). Pulling from Docker Hub anonymously, which is rate limited and may fail with 429 Too Many Requests."
          fi

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.login == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=nightly
            type=raw,value=nightly-{{date 'YYYYMMDD'}}

      # Nightly builds the same multi-arch matrix as stable (amd64 + arm64) so
      # the :nightly tag is usable on the same hosts as :latest. arm64 is built
      # under QEMU emulation, which is slower (~10min vs ~3min native) but keeps
      # the workflow single-job. The release workflow uses GoReleaser with
      # per-arch Dockerfiles instead, trading workflow setup for native speed
      # where wall-clock matters.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build/docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
